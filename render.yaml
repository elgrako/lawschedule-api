services:
  - type: web
    name: lawschedule-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: JWT_SECRET
        generateValue: true
      # La DB real es un proyecto Neon externo (Postgres, Frankfurt), no un
      # recurso Postgres de Render -- por eso "sync: false": el valor se
      # gestiona a mano en el dashboard de Render y un sync del Blueprint no
      # debe tocarlo ni intentar recrear una DB de Render inexistente.
      - key: DATABASE_URL
        sync: false
